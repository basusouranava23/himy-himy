<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Demo – Google Sign‑In</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Load Firebase SDKs as ES modules -->
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="container">
    <h1>AI Demo with Google Sign‑In</h1>

    <div id="auth-section">
      <button id="sign-in-btn" type="button">Sign in with Google</button>
      <button id="sign-out-btn" class="hidden" type="button">Sign Out</button>
    </div>

    <div id="user-info" class="hidden">
      <img id="user-photo" src="" alt="User Photo" />
      <p id="user-name"></p>
    </div>

    <div id="ai-section" class="hidden">
      <textarea id="prompt" placeholder="Ask the AI something..."></textarea>
      <button id="ask-btn" type="button">Ask</button>
      <pre id="response"></pre>
    </div>
  </div>
</body>
</html>
